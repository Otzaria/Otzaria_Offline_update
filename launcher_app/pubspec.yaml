name: launcher_app
description: >-
  Unified dashboard launcher for Otzaria: wires together otzaria_manager
  (Otzaria app itself) and library_manager (the seforim DB), with a slot
  reserved for the not-yet-built plugins_manager module.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  seforim_library_updater:
    path: ../
  otzaria_manager:
    path: ../otzaria_manager
  library_manager:
    path: ../library_manager
  path: ^1.9.1
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  inno_bundle: ^0.11.2

flutter:
  uses-material-design: true

# תצורת inno_bundle (dart run inno_bundle --release) — בונה installer
# EXE יחיד עם Inno Setup. id הוא GUID קבוע (AppId) שנוצר פעם אחת כאן -
# **אסור לשנות אותו אחרי שמישהו כבר התקין גרסה**, אחרת מנגנון העדכון של
# Windows יראה בזה אפליקציה אחרת לגמרי. שאר השדות אופציונליים ואפשר
# לשנות אותם בחופשיות; ראו תיעוד:
# https://github.com/hahouari/inno_bundle/wiki/Configuration-Options
inno_bundle:
  id: f05c729e-3e7d-420e-9e1f-741f4d1ccbb2
  name: Otzaria Launcher
  publisher: Otzaria

