name: launcher_app
description: >-
  Unified dashboard launcher for Otzaria: wires together otzaria_manager
  (Otzaria app itself) and library_manager (the seforim DB), with a slot
  reserved for the not-yet-built plugins_manager module. (Hebrew details
  in README.md — kept ASCII here because inno_bundle feeds this string
  into the Inno Setup script, which chokes on non-ASCII text.)
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  seforim_library_updater:
    path: ../
  otzaria_manager:
    path: ../otzaria_manager
  library_manager:
    path: ../library_manager
  path: ^1.9.1
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  inno_bundle: any

flutter:
  uses-material-design: true

# הגדרות ל-inno_bundle (https://pub.dev/packages/inno_bundle): עוטף את
# תיקיית build/windows/.../Release כולה (exe + DLLs + נתונים) לתוך קובץ
# EXE יחיד להתקנה/הפצה, דרך Inno Setup.
# ⚠️ id הוא GUID קבוע — נוצר פעם אחת כאן ואסור לשנות אותו בעתיד (אחרת
# מנגנון העדכון של המתקין יתייחס לזה כאפליקציה אחרת).
# ⚠️ name נשאר ASCII בכוונה: ניסיון קודם עם "לאנצ'ר אוצריא" (עברית)
# גרם ל-Inno Setup Compiler לזרוק "Illegal character in input file" —
# ה-.iss script שנוצר לא תומך (או שinno_bundle לא כתב אותו) בעברית.
inno_bundle:
  id: efe99035-e4db-465a-926d-ac0b80fa4db1
  publisher: Yehuda-Zakesh
  name: "Otzaria Launcher"
  # מוגדר מפורשות ל-English בלבד: ברירת המחדל של inno_bundle כוללת רשימת
  # שפות רחבה (כולל איסלנדית וכו') שקובצי ה-.isl שלהן לא בהכרח מותקנים
  # עם Inno Setup ב-CI (רק ההתקנה הבסיסית), מה שגורם ל-
  # "Couldn't open include file ...Icelandic.isl" בזמן קימפול הסקריפט.
  languages:
    - English
