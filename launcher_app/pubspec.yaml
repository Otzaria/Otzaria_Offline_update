name: launcher_app
description: >-
  Unified dashboard launcher for Otzaria: wires together otzaria_manager
  (Otzaria app itself), library_manager (the seforim DB) and plugins_manager
  (the offline Otzaria plugin store).
version: 0.4.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  seforim_library_updater:
    path: ../
  otzaria_l10n:
    path: ../otzaria_l10n
  otzaria_manager:
    path: ../otzaria_manager
  library_manager:
    path: ../library_manager
  plugins_manager:
    path: ../plugins_manager
  custom_apps_manager:
    path: ../custom_apps_manager
  path: ^1.9.1
  path_provider: ^2.1.4
  # העדכון העצמי של הלאנצ'ר מדבר עם GitHub API ומוריד את ה-exe בעצמו
  # (`lib/src/self_update/`) — שאר החבילות מביאות את http אצלן.
  http: ^1.6.0
  file_picker: ^8.1.2
  # אותה ספריית אייקונים כמו באוצריא — האייקונים היחידים שמותר להשתמש בהם.
  fluentui_system_icons: ^1.1.249
  cupertino_icons: ^1.0.8
  # רינדור Markdown ל"מה התחדש" (יומן השינויים) — המשך-הדרך של flutter_markdown
  # שהופסק על ידי צוות Flutter.
  flutter_markdown_plus: ^1.0.12
  # שורת כותרת מותאמת אישית (כמו באוצריא): מסתירה את מסגרת החלון של המערכת
  # ומספקת גרירה וכפתורי חלון משלנו.
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # טיימרים מזויפים לבדיקת דילול ההתקדמות — בלי להמתין בזמן אמת.
  fake_async: ^1.3.1
  # בניית `seforim.db` אמיתי בבדיקות, כדי שקריאת הגרסה תרוץ במלואה.
  sqlite3: ^3.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

