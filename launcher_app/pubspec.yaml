name: launcher_app
description: >-
  לאנצ'ר אוצריא מאוחד — דשבורד Flutter אחד שמחווט יחד את otzaria_manager
  (עדכון/התקנה/הפעלה של אוצריא עצמה) ו-library_manager (עדכון המסד), עם
  מקום שמור למודול plugins_manager שעדיין לא נבנה.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  seforim_library_updater:
    path: ../
  otzaria_manager:
    path: ../otzaria_manager
  library_manager:
    path: ../library_manager
  path: ^1.9.1
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  inno_bundle: any

flutter:
  uses-material-design: true

# הגדרות ל-inno_bundle (https://pub.dev/packages/inno_bundle): עוטף את
# תיקיית build/windows/.../Release כולה (exe + DLLs + נתונים) לתוך קובץ
# EXE יחיד להתקנה/הפצה, דרך Inno Setup.
# ⚠️ id הוא GUID קבוע — נוצר פעם אחת כאן ואסור לשנות אותו בעתיד (אחרת
# מנגנון העדכון של המתקין יתייחס לזה כאפליקציה אחרת).
inno_bundle:
  id: efe99035-e4db-465a-926d-ac0b80fa4db1
  publisher: Yehuda-Zakesh
  name: "לאנצ'ר אוצריא"
