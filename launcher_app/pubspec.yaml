name: launcher_app
description: >-
  Unified dashboard launcher for Otzaria: wires together otzaria_manager
  (Otzaria app itself) and library_manager (the seforim DB), with a slot
  reserved for the not-yet-built plugins_manager module.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  seforim_library_updater:
    path: ../
  otzaria_manager:
    path: ../otzaria_manager
  library_manager:
    path: ../library_manager
  path: ^1.9.1
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  # אותה ספריית אייקונים כמו באוצריא — האייקונים היחידים שמותר להשתמש בהם.
  fluentui_system_icons: ^1.1.249
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

