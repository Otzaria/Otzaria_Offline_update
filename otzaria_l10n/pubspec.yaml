name: otzaria_l10n
description: >-
  חבילת Dart טהורה שמרכזת את **כל** המלל שמוצג למשתמש בלאנצ'ר — כולל הודעות
  השגיאה וההתקדמות שנוצרות בחבילות התשתית. עברית ואנגלית, בלי קוד-ג'ן ובלי
  תלות ב-Flutter, כדי שגם otzaria_manager ו-plugins_manager יוכלו להשתמש בה.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dev_dependencies:
  test: ^1.30.1
  lints: ^4.0.0
