name: otzaria_manager
description: >-
  חבילת Dart לניהול התקנת/עדכון/הפעלת אפליקציית אוצריא עצמה (לא ה-DB) —
  שולפת release אחרון (כולל PR-preview) מ-github.com/Sivan22/otzaria,
  מתקינה בשקט (Inno Setup /VERYSILENT) לתיקייה מנוהלת, ומפעילה את התוכנה.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  equatable: ^2.0.8
  path: ^1.9.1
  http: ^1.6.0

dev_dependencies:
  test: ^1.30.1
  lints: ^4.0.0
