name: error_reports_manager
description: >-
  חבילת Dart לנשיאת דיווחי טעויות של אוצריא מהמחשב הלא-מקוון אל המקוון:
  איסוף הדיווחים שלא נשלחו ישירות מהתור של אוצריא אל הכונן, ושליחתם לשרת
  של אוצריא מהמחשב שמחובר לרשת.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  otzaria_l10n:
    path: ../otzaria_l10n
  path: ^1.9.1
  http: ^1.6.0
  crypto: ^3.0.7
  # קריאה וכתיבה ישירה לתור הדיווחים ב-`user_state.db` של אוצריא.
  sqlite3: ^3.3.3

dev_dependencies:
  test: ^1.30.1
  lints: ^4.0.0
