name: otzaria_offline_update
description: >-
  כלי המאגר שבשורש: כיסוי הבדיקות (tool/coverage.dart) וכלי מדידה של ה-hash
  הלוגי. מנוע העדכון עצמו הוא החבילה seforim_library_updater של
  Otzaria/otzaria_library_updater.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  seforim_library_updater:
    git:
      url: https://github.com/Otzaria/otzaria_library_updater.git
      ref: 38ce5f01bb35bac106a9076addafc3e2cde685ff
  sqlite3: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.30.1
  flutter_lints: ^4.0.0
