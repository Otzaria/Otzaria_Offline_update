name: plugins_manager
description: >-
  חבילת Dart לחנות התוספים של אוצריא במצב אופליין — מסנכרנת את הקטלוג
  מ-otzaria.org אל תיקיית מראה מקומית (קטלוג + תמונות + קובצי .otzplugin),
  מזהה אילו תוספים כבר מותקנים באוצריא, ומתקינה דרך הפרוטוקול otzaria://.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  otzaria_l10n:
    path: ../otzaria_l10n
  equatable: ^2.0.8
  path: ^1.9.1
  http: ^1.6.0
  # אותה מייג'ור כמו ב-library_manager — שתי החבילות נפתרות יחד ב-launcher_app.
  archive: ^4.0.9

dev_dependencies:
  test: ^1.30.1
  lints: ^4.0.0
