name: custom_apps_manager
description: >-
  חבילת Dart לתוכנות מותאמות — "תוספי עדכון" שהמשתמש מוסיף בעצמו, כדי
  שהלאנצ'ר יידע לשאת ולהתקין גם תוכנה שאינה אוצריא. התוסף הוא תיאור
  דקלרטיבי (JSON) ולא קוד: מאיפה מגיע קובץ ההתקנה, כיצד מתקינים אותו
  בשקט, וכיצד מזהים מה כבר מותקן.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  otzaria_l10n:
    path: ../otzaria_l10n
  path: ^1.9.1
  http: ^1.6.0

dev_dependencies:
  test: ^1.30.1
  lints: ^4.0.0
