name: download_bench
description: >-
  מדידת מסלולי ההורדה של הכלי מול שרת מקומי מוגבל קצב ומול GitHub (#149).
  כלי אבחון בלבד; שום חבילה אינה תלויה בו.
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  ffi: ^2.1.0
  http: ^1.6.0
  otzaria_downloads:
    path: ../../otzaria_downloads
  # חייב להיות זהה ל-ref שבשורש (pubspec.yaml), ב-library_manager וב-launcher_app.
  seforim_library_updater:
    git:
      url: https://github.com/Otzaria/otzaria_library_updater.git
      ref: f88edf39c3aa307c304e7f9608d30604b8f36457

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
