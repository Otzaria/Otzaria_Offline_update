name: library_manager
description: >-
  חבילת Flutter המחווטת (wiring) את seforim_library_updater אל תוך הלאנצ'ר:
  איתור תיקיית ה-DB (ברירת מחדל של אוצריא, או נתיב מותאם אישית), בדיקה
  שאוצריא סגורה לפני שינוי הקובץ, והרצת מסלול העדכון (delta/הורדה מלאה).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  seforim_library_updater:
    path: ../
  http: ^1.6.0
  zstandard: ^1.3.26
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.30.1
  lints: ^4.0.0
