name: library_manager
description: >-
  חבילת Flutter המחווטת (wiring) את seforim_library_updater אל תוך הלאנצ'ר:
  איתור תיקיית ה-DB (ברירת מחדל של אוצריא, או נתיב מותאם אישית), בדיקה
  שאוצריא סגורה לפני שינוי הקובץ, והרצת מסלול העדכון (delta/הורדה מלאה).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  seforim_library_updater:
    path: ../
  otzaria_l10n:
    path: ../otzaria_l10n
  zstandard: ^1.3.26
  # ה-bindings של libzstd שחבילת zstandard מביאה איתה בכל מקרה. נדרשים
  # ישירות בשביל ה-streaming API (ZSTD_decompressStream) — ראו
  # ZstdFileDecompressor: החילוץ ה-one-shot של zstandard מחזיק את כל ה-DB
  # (~1.1GB) ב-RAM, וזה מה שמאפשר לחלץ קובץ-לקובץ בלי זה.
  zstandard_native: ^1.5.0
  ffi: ^2.1.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.30.1
  # לבדיקות בלבד: יצירת `seforim.db` אמיתי (טבלת schema_meta) כדי שמסלול
  # הבדיקה/ההחלה ייבדק מול LocalDbVersionReader האמיתי ולא מול קורא מזויף.
  sqlite3: ^3.3.3
  # flutter_lints ולא lints: זו חבילת Flutter, ואותה ערכה כמו בשורש הריפו
  # וב-launcher_app (ראו analysis_options.yaml).
  flutter_lints: ^4.0.0
