# הידוקי האנלייזר שחלים על **כל** שש החבילות בריפו.
#
# למה קובץ אחד ולא העתק בכל חבילה: ערכת ה-lint הבסיסית כן חייבת להיות מקומית
# (`flutter_lints` לחבילות Flutter, `lints/recommended` ל-Dart טהור — ראו
# ההערות בכל `analysis_options.yaml`), אבל מה שמעליה נטה להיכנס לחבילה אחת
# ולהיעלם מהשאר. בדיוק זה קרה עם `prefer_single_quotes`, שהיה מופעל
# ב-`otzaria_l10n` לבדה. כל חבילה מייבאת את הבסיס שלה **ואת** הקובץ הזה.
#
# כל חוק כאן נמדד ונמצא **נקי בשש החבילות** לפני שהופעל: אלה מנעולי-רצפה
# שמונעים נסיגה, לא חוב שנפתח כאן. חוק שמייצר הפרות אמיתיות אינו נכנס לכאן
# לפני שהן תוקנו.
#
# נמדדו ונדחו במכוון: `avoid_dynamic_calls` ו-`unnecessary_lambdas`. כל
# ההפרות שלהם (5 ו-11) יושבות בקוד הבדיקות — מניפולציית JSON ו-tear-offs —
# ואינן מלמדות דבר על קוד הייצור, שנקי משתיהן ממילא.
#
# **טרם הופעלו:** `strict-inference` ו-`strict-raw-types`. שניהם נקיים בקוד
# הייצור אבל מפיקים יחד 16 אזהרות בקובצי הבדיקות (literals של `List`/`Map`
# בלי ארגומנט טיפוס): 4 בשורש, 2 ב-library_manager, 10 ב-plugins_manager.
# תיקון מכני, אבל הוא סבב בפני עצמו — ואין להפעיל אותם לפני שהוא נעשה
# **בשש** החבילות, אחרת CI נופל על חבילה שלא נמדדה.
analyzer:
  language:
    # טיפוס שנשמט ל-`dynamic` דוחה את השגיאה מזמן קומפילציה לזמן ריצה. בקוד
    # שכולו פענוח JSON מרשת זה ההפרש בין "המראה פגומה" מסודר לבין קריסה.
    strict-casts: true

linter:
  rules:
    # `Future` שנשכח בלי `await` — באג שקט בריפו שכל מסלול בו אסינכרוני.
    # הקוד כאן כבר מסמן כל כוונה כזו ב-`unawaited(...)`; זה מה שאוכף זאת.
    - unawaited_futures
    - always_declare_return_types
    - prefer_final_locals
    - unnecessary_parenthesis
    # היה מופעל ב-`otzaria_l10n` לבדה — הדוגמה שבגללה הקובץ הזה קיים.
    - prefer_single_quotes
    - directives_ordering
