name: Build EXE (launcher_app only)

# ריצה מהירה: רק build windows ל-launcher_app, בלי analyze/test על שאר
# החבילות. ה-CI המלא (ci.yml) עדיין רץ בנפרד על כל push/PR.
#
# ⚠️ זהו ארטיפקט לבדיקה בלבד. מה שמופץ למשתמשים נבנה ומפורסם ב-ci.yml,
# ורק שם הגרסה מוצבת לפי הריצה — ה-exe שנוצר כאן נושא את המספר שכתוב
# ב-pubspec.yaml ולא את מספר ה-release.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-exe:
    name: launcher_app (windows build only)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      # תיקיית windows/ (ה-runner) עדיין לא הופקה מקומית — משלימים אותה
      # כאן; לא אמור לגעת ב-lib/ או ב-pubspec.yaml.
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      # אין מתקין — אפליקציית "portable" בקובץ exe בודד: ה-stub נושא את
      # ערמת הקבצים כ-resource ומחלץ אותה לידו בהרצה הראשונה
      # (ראו windows_stub/).
      - name: Package portable build
        shell: pwsh
        run: .\windows_stub\package.ps1
      # glob ולא השם המלא: הקובץ הוא "עדכוני אוצריא.exe", ואין טעם לתלות
      # את ה-workflow בקידוד של שם עברי.
      - uses: actions/upload-artifact@v4
        with:
          name: launcher_app-windows-portable
          path: launcher_app/build/*.exe
          if-no-files-found: error
