name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub global activate coverage 1.15.1
      - run: dart tool/coverage.dart --collect --min=60 --target=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: |
            build/coverage/lcov.info
            build/coverage/run.log
            build/coverage/summary.json
            */build/coverage/lcov.info
            */build/coverage/run.log
          if-no-files-found: error
