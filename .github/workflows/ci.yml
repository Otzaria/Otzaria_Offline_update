name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# ה-workflow הזה גם **מפרסם**: כל דחיפה ל-main שכל הבדיקות בה עברו מקדמת
# את מספר הגרסה ומעלה release חדש (ראו הג'וב `publish` בסוף). הפרסום יושב
# כאן ולא ב-workflow נפרד כדי לא לבנות את הלאנצ'ר פעמיים על אותו קומיט —
# הג'ובים כאן ממילא מייצרים בדיוק את שני הקבצים שמופצים.
permissions:
  contents: write

jobs:
  # מספר הגרסה של הריצה הזאת — הצעד הבא אחרי מה שב-pubspec, ואם התג הזה
  # כבר קיים (ריצה חוזרת, או פרסום שכבר קרה) מתקדמים לפנוי הבא. הג'ובים
  # שבונים את הלאנצ'ר מציבים אותו בקוד לפני הבנייה, כך שהקובץ המופץ מדווח
  # על עצמו את אותו מספר שבתג.
  version:
    name: next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # התגים נחוצים כדי לדעת מה כבר פורסם
      - id: next
        run: |
          # הגרסה היא בת שני חלקים (`0.2`) ורק החלק השני עולה. ב-pubspec
          # יושב `0.2.0` — pub דורש שלושה חלקים — ולכן קוראים רק את השניים
          # הראשונים ומתעלמים מהשארית.
          #
          # ⚠️ התג נשאר בן שלושה חלקים (`v0.2.0`) ואינו הולך אחרי המספר
          # המוצג. כל לאנצ'ר שכבר בשטח פוסל תג שאינו `vX.Y.Z` בדיוק, ולכן
          # `v0.2` היה release שאיש מהמשתמשים הקיימים אינו יכול למצוא.
          current="$(sed -n 's/^version:[[:space:]]*//p' launcher_app/pubspec.yaml | head -1 | cut -d+ -f1 | tr -d '[:space:]')"
          major="${current%%.*}"; rest="${current#*.}"
          minor="${rest%%.*}"
          minor=$((minor + 1))
          while git rev-parse -q --verify "refs/tags/v$major.$minor.0" >/dev/null; do
            minor=$((minor + 1))
          done
          echo "version=$major.$minor" >> "$GITHUB_OUTPUT"
          echo "tag=v$major.$minor.0" >> "$GITHUB_OUTPUT"
          echo "מ-$current אל $major.$minor (תג v$major.$minor.0)"

  seforim_library_updater:
    name: seforim_library_updater (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  otzaria_manager:
    name: otzaria_manager (analyze + test)
    # רץ גם על macOS: המסלול של macOS ב-otzaria_manager מריץ כלי מערכת
    # אמיתיים (plutil, ditto, open), ולכן חלק מהבדיקות משמעותיות רק שם.
    # אלה שדורשות macOS מסומנות ב-@TestOn/testOn ומדולגות בשקט בלינוקס.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: otzaria_manager
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  # ה-analyze של השורש מחריג את החבילה הזאת (ראו analysis_options.yaml), ולכן
  # בלי הג'וב הזה היא לא נבדקת בשרת בכלל — ובה יושב כל המלל של התוכנה.
  otzaria_l10n:
    name: otzaria_l10n (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: otzaria_l10n
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  plugins_manager:
    name: plugins_manager (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins_manager
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  custom_apps_manager:
    name: custom_apps_manager (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom_apps_manager
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  library_manager:
    name: library_manager (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library_manager
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  launcher_app:
    name: launcher_app (analyze + windows build)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@v4
      # לפני הכול: הגרסה של הריצה הזאת נכנסת ל-pubspec ול-launcher_version.dart,
      # ומשם ל-exe עצמו (`launcherVersion`, המרקר `.ready`, משאב הגרסה).
      - name: Set the release version
        shell: bash
        run: bash ../tool/set_launcher_version.sh "${{ needs.version.outputs.version }}"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      # תיקיית windows/ (ה-runner) עדיין לא הופקה מקומית (נכתב בסביבה בלי
      # Flutter SDK) — משלימים אותה כאן; לא אמור לגעת ב-lib/ או ב-pubspec.yaml.
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build windows --release
      # אין מתקין — exe בודד ונייד (זהה ל-build-exe.yml): ה-stub נושא את
      # ערמת הקבצים כ-resource ומחלץ אותה ל-app-files לידו בהרצה הראשונה,
      # כי Flutter ל-Windows לא מייצר exe יחיד בלאו הכי.
      - name: Package portable build
        shell: pwsh
        run: .\windows_stub\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: launcher_app-windows-portable-ci
          path: launcher_app/build/*.exe
          if-no-files-found: error

  launcher_app_macos:
    name: launcher_app (analyze + macos build)
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@v4
      - name: Set the release version
        run: bash ../tool/set_launcher_version.sh "${{ needs.version.outputs.version }}"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      # אין כאן `flutter create` בכוונה — תיקיית macos/ נשמרת בגיט (ראו
      # ההערה ב-build-macos.yml), ויצירה מחדש הייתה דורסת את ההתאמות שבה.
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # ⚠️ אין כאן `flutter test` בכוונה. מערך הבדיקות של הלאנצ'ר רץ במלואו
      # בג'וב של ווינדוס, והוא גם היעד האמיתי של החלקים תלויי-הפלטפורמה שבו
      # (סריקת `exe`, הרישום, `tasklist`) — ב-macOS הם מחזירים null ומפילים
      # את הג'וב על משהו שאינו מייצג תקלה. הג'וב הזה קיים כדי **לבנות**.
      # ה-.app הוא ההפצה עצמה — אין מתקין ל-macOS (גוררים ל-Applications).
      - run: flutter build macos --release
      - name: Zip the .app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            "Otzaria Launcher.app" \
            "$GITHUB_WORKSPACE/launcher_app/launcher_app-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher_app-macos
          path: launcher_app/launcher_app-macos.zip
          if-no-files-found: error

  # ── פרסום אוטומטי ───────────────────────────────────────────────────────────
  # דחיפה ל-main שכל הג'ובים שמעל עברו בה: מקדמים את הגרסה בקוד, מתייגים,
  # ומעלים release עם ה-exe וה-zip. משם העדכון העצמי של הלאנצ'ר מוצא אותו
  # מעצמו (`LauncherReleaseClient`) ומציע למשתמשים להוריד.
  #
  # אין כאן בנייה נוספת: הקבצים הם הארטיפקטים של הג'ובים שלמעלה, ולכן מה
  # שמפורסם הוא בדיוק מה שנבדק.
  publish:
    name: publish release
    needs:
      - version
      - seforim_library_updater
      - otzaria_l10n
      - otzaria_manager
      - plugins_manager
      - custom_apps_manager
      - library_manager
      - launcher_app
      - launcher_app_macos
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # פרסום אחד בכל רגע: שתי דחיפות צמודות היו מנסות לתייג במקביל.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Bump the version in the repository
        run: |
          bash ./tool/set_launcher_version.sh "${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `[skip ci]` הוא חגורה נוספת: דחיפה עם GITHUB_TOKEN אינה מפעילה
          # workflow חדש בלאו הכי, ולכן אין כאן לופ.
          git diff --quiet || git commit -am "גרסה ${{ needs.version.outputs.version }} [skip ci]"
      - name: Tag and push
        run: |
          tag="${{ needs.version.outputs.tag }}"
          # התג נבדק שוב **עכשיו**: בין תחילת הריצה לכאן יכול היה להתפרסם
          # release אחר, ולדרוס אותו בקבצים של בנייה אחרת זו הפגיעה הגרועה
          # מכולן. כישלון רועש כאן עדיף — דחיפה נוספת תקבל מספר פנוי.
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag כבר קיים — יש להריץ מחדש כדי לקבל מספר פנוי"
            exit 1
          fi
          git tag "$tag"
          git push origin HEAD:main
          git push origin "$tag"
      # גיטהאב מנקה תווים שאינם ASCII משמות של נכסי release, ולכן
      # `עדכוני אוצריא.exe` — שם שכולו עברית — נמחק אצלו עד הסוף והתפרסם
      # כ-`default.exe` (v0.1.1, וגם ב-release הידני V1). השם שעל הכונן נשאר
      # עברי; רק מה שיושב על ה-release מקבל שם לטיני, והוא גם השם שנדבק למי
      # שמוריד ידנית בפעם הראשונה — ראו `LauncherInstallLayout.publishedExeName`.
      - name: Give the Windows asset an ASCII name
        run: |
          exe="$(find assets -maxdepth 1 -name '*.exe' | head -1)"
          if [ -z "$exe" ]; then
            echo "::error::לא נמצא exe בארטיפקטים — release בלי הקובץ לווינדוס גרוע מג'וב אדום"
            exit 1
          fi
          if [ "$exe" != "assets/Otzaria-Updates.exe" ]; then
            mv "$exe" assets/Otzaria-Updates.exe
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          # ה-release נוצר כ**יציב**: הלקוח של העדכון העצמי פוסל pre-release
          # ו-draft, כי הלאנצ'ר נוסע למחשבים שאין בהם איך לתקן גרסה שבורה.
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes \
            assets/*
