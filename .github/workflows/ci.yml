name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  seforim_library_updater:
    name: seforim_library_updater (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  otzaria_manager:
    name: otzaria_manager (analyze + test)
    # רץ גם על macOS: המסלול של macOS ב-otzaria_manager מריץ כלי מערכת
    # אמיתיים (plutil, ditto, open), ולכן חלק מהבדיקות משמעותיות רק שם.
    # אלה שדורשות macOS מסומנות ב-@TestOn/testOn ומדולגות בשקט בלינוקס.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: otzaria_manager
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  library_manager:
    name: library_manager (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library_manager
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  launcher_app:
    name: launcher_app (analyze + windows build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      # תיקיית windows/ (ה-runner) עדיין לא הופקה מקומית (נכתב בסביבה בלי
      # Flutter SDK) — משלימים אותה כאן; לא אמור לגעת ב-lib/ או ב-pubspec.yaml.
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Inno Setup דרוש עבור inno_bundle; מותקן מראש ב-Chocolatey על
      # ה-runner הזה, לא אמור לדרוש הורדה נוספת.
      - run: choco install innosetup -y
      # בונה את האפליקציה (flutter build windows) ועוטף אותה מיד לקובץ
      # EXE יחיד להתקנה, כולל כל ה-DLLs והנתונים הנדרשים.
      - run: dart run inno_bundle:build --release
      - uses: actions/upload-artifact@v4
        with:
          name: launcher_app-windows-installer
          path: launcher_app/installer/**
          if-no-files-found: error

  launcher_app_macos:
    name: launcher_app (analyze + macos build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      # אין כאן `flutter create` בכוונה — תיקיית macos/ נשמרת בגיט (ראו
      # ההערה ב-build-macos.yml), ויצירה מחדש הייתה דורסת את ההתאמות שבה.
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # ה-.app הוא ההפצה עצמה — אין מתקין ל-macOS (גוררים ל-Applications).
      - run: flutter build macos --release
      - name: Zip the .app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            "Otzaria Launcher.app" \
            "$GITHUB_WORKSPACE/launcher_app/launcher_app-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher_app-macos
          path: launcher_app/launcher_app-macos.zip
          if-no-files-found: error
