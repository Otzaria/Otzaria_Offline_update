name: Build macOS app (launcher_app only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: launcher_app (macos build only)
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
          pub-cache-key: flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-manual-macos
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --release --no-pub
      - name: Zip the .app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            "Otzaria Launcher.app" \
            "$GITHUB_WORKSPACE/launcher_app/launcher_app-macos.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher_app-macos
          path: launcher_app/launcher_app-macos.zip
          if-no-files-found: error
          compression-level: 0
