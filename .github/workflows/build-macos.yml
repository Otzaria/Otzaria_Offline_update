name: Build macOS app (launcher_app only)

# מקבילה ל-build-exe.yml: ריצה מהירה של build ל-macOS בלבד, בלי
# analyze/test על שאר החבילות. ה-CI המלא (ci.yml) עדיין רץ בנפרד.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-macos:
    name: launcher_app (macos build only)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: launcher_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      # בשונה מ-windows/, תיקיית macos/ **כן** נשמרת בגיט — היא מכילה
      # התאמות שאינן ברירת מחדל (bundle id, entitlements בלי sandbox,
      # CFBundleDisplayName בעברית), ו-`flutter create` היה דורס אותן.
      - run: flutter pub get
      - run: flutter build macos --release
      # אין מתקין — אורזים את ה-.app עצמו. חובה ditto (ולא zip רגיל): רק
      # הוא שומר symlinks/xattrs של ה-bundle, כך שהחתימה לא נשברת בדרך
      # ואפשר פשוט לגרור את התוצאה ל-Applications.
      - name: Zip the .app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            "Otzaria Launcher.app" \
            "$GITHUB_WORKSPACE/launcher_app/launcher_app-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher_app-macos
          path: launcher_app/launcher_app-macos.zip
          if-no-files-found: error
